{% extends 'posts/base.html' %}

{% block title %}Eliminar post | Mi Blog{% endblock %}

{% block content %}
<section class="seccion">
    <h2>Eliminar post</h2>
    <p>¿Seguro que querés eliminar <strong>"{{ post.titulo }}"</strong>?</p>
    <p class="sin-imagen">Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="acciones">
            <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
            <a href="{% url 'posts:detalle_post' post.pk %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
