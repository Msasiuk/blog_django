{% extends 'posts/base.html' %}

{% block title %}Registrarse | Mi Blog{% endblock %}

{% block content %}
<section class="seccion formulario-angosto">
    <h2>Crear cuenta</h2>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Registrarme</button>
    </form>

    <p>¿Ya tenés cuenta? <a href="{% url 'accounts:login' %}">Iniciá sesión</a></p>
</section>
{% endblock %}
