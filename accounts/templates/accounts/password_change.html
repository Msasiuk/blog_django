{% extends 'posts/base.html' %}

{% block title %}Cambiar contraseña | Mi Blog{% endblock %}

{% block content %}
<section class="seccion formulario-angosto">
    <h2>Cambiar contraseña</h2>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones">
            <button type="submit" class="boton">Cambiar contraseña</button>
            <a href="{% url 'accounts:perfil' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
